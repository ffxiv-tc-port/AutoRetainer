name: Build Check

on:
  push:
    branches: '*'
    tags-ignore: '*'
  pull_request:
  workflow_dispatch:

jobs:
  gate:
    runs-on: ubuntu-latest
    outputs:
      proceed: ${{ steps.check.outputs.proceed }}
    steps:
      - uses: actions/checkout@v4
      - name: Check if VersionPrefix changed from baseline
        id: check
        shell: bash
        run: |
          PREFIX=$(grep -oP '(?<=<VersionPrefix>)[^<]+' AutoRetainer/AutoRetainer.csproj)
          echo "Current VersionPrefix: $PREFIX (baseline: 7.15.0)"
          if [ "$PREFIX" = "7.15.0" ]; then
            echo "proceed=false" >> "$GITHUB_OUTPUT"
          else
            echo "proceed=true" >> "$GITHUB_OUTPUT"
          fi

  build:
    needs: gate
    if: needs.gate.outputs.proceed == 'true'
    runs-on: windows-latest
    env:
      CI: true
      DALAMUD_HOME: ${{ github.workspace }}\dalamud
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive
          token: ${{ secrets.PRIVATE_SUBMODULE_TOKEN }}
      - name: Install .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 9.x
      - name: Download Dalamud (pinned TC-compatible build)
        shell: pwsh
        run: |
          Invoke-WebRequest -Uri https://github.com/ffxiv-tc-port/DalamudPluginsTC/releases/download/dalamud-pin-v12.0.2/dalamud-api12-net9.zip -OutFile dalamud-pinned.zip
          Expand-Archive -Force dalamud-pinned.zip "$env:DALAMUD_HOME"
          Expand-Archive -Force dalamud-pinned.zip "$env:APPDATA\xivlauncher\Addon\Hooks\dev\"
      - name: Build with dotnet
        run: dotnet build --configuration Release AutoRetainer/AutoRetainer.csproj
